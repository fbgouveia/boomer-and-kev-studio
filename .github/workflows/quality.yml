name: Quality

on:
  pull_request:
  push:
    branches: [restore-engine]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:deploy
      - run: npm run build
      - run: npm run verify:standalone
      - run: npm run test:idempotency:standalone
