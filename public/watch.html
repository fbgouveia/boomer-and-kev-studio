<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boomer &amp; Kev — Episode Preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .header {
      margin-bottom: 20px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #e11d48, #be123c);
      color: #fff;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 800;
      border-radius: 9999px;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 0 15px rgba(225, 29, 72, 0.4);
    }
    h1 {
      margin: 12px 0 6px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .meta {
      color: #71717a;
      margin: 0;
      font-size: 13px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .video-wrapper {
      position: relative;
      width: 360px;
      height: 640px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.1);
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .controls-hint {
      margin-top: 14px;
      font-size: 12px;
      color: #a1a1aa;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="badge">Master Render (9:16 Vertical)</span>
    <h1>Boomer &amp; Kev: Fuel Prices &amp; Outrage</h1>
    <p class="meta">1080x1920 &bull; 30 FPS &bull; ElevenLabs + Kling v2.6 &bull; ID: 3c5a5f6b</p>
  </div>
  <div class="video-wrapper">
    <video controls autoplay playsinline loop src="/latest_episode.mp4"></video>
  </div>
  <div class="controls-hint">
    Use player controls to pause, seek, unmute or enter fullscreen.
  </div>
</body>
</html>
